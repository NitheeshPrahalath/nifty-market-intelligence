services:
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: nmi-db
    environment:
      POSTGRES_USER: nmi
      POSTGRES_PASSWORD: nmi
      POSTGRES_DB: nmi
    ports:
      - "5432:5432"
    volumes:
      - nmi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmi -d nmi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nmi-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nmi_pgdata: